name: music_player
description: A beautiful Flutter music player app similar to Spotify.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.2.0
  spotify_sdk: ^0.3.0
  audio_service: ^0.18.12
  just_audio: ^0.9.34
  get: ^4.6.5
  http: ^1.1.0
  dio: ^5.3.1
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.1.0
  animated_bottom_navigation_bar: ^1.2.0
  font_awesome_flutter: ^10.6.0
  lottie: ^2.4.0
  intl: ^0.19.0
  dartz: ^0.10.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  fonts:
    - family: Spotify
      fonts:
        - asset: assets/fonts/SpotifyFont-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpotifyFont-Regular.ttf
          weight: 400
